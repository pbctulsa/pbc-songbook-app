name: iOS build and tests
on:
  push:
    branches: ['feat/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Verify project generation
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- PBCSongbook.xcodeproj
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/devices.json'))
          devices = [d for runtime, values in sorted(data['devices'].items(), reverse=True) if 'iOS' in runtime for d in values if d['name'].startswith('iPhone') and d['isAvailable']]
          assert devices, 'No iPhone simulator is installed'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: xcodebuild test -project PBCSongbook.xcodeproj -scheme PBCSongbook -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
